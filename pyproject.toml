[project]
name = "agent-sense"
version = "0.1.0"
description = "Local, deterministic checks for work done with coding agents: is it really done, does the page really work, is it ready to publish"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
keywords = ["coding-agent", "claude-code", "lint", "pre-commit", "hooks", "testing", "playwright"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.optional-dependencies]
browser = ["playwright>=1.49"]   # needed by `page` and `launch` only

[project.scripts]
agent-sense = "agent_sense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_sense"]

# The runtime services ship inside the package; tests, evals and docs stay in the repository.
[tool.hatch.build.targets.wheel.force-include]
"services/done/done_lib.py" = "agent_sense/_services/done/done_lib.py"
"services/deps/deps_lib.py" = "agent_sense/_services/deps/deps_lib.py"
"services/context/context_lib.py" = "agent_sense/_services/context/context_lib.py"
"services/boundary/boundary_lib.py" = "agent_sense/_services/boundary/boundary_lib.py"
"services/features/features_lib.py" = "agent_sense/_services/features/features_lib.py"
"services/page/page_lib.py" = "agent_sense/_services/page/page_lib.py"
"services/launch/launch_lib.py" = "agent_sense/_services/launch/launch_lib.py"
"services/session/session_lib.py" = "agent_sense/_services/session/session_lib.py"
"services/launch/vendors.json" = "agent_sense/_services/launch/vendors.json"
"contracts/schema.py" = "agent_sense/_services/contracts/schema.py"
"contracts/__init__.py" = "agent_sense/_services/contracts/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["agent_sense", "services", "contracts", "README.md", "LICENSE", "pyproject.toml"]
