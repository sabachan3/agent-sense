<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat form</title></head><body><h1>Chat</h1><ul id="log"></ul><form id="f"><input id="chat" name="q" placeholder="Message"><button>Send</button></form>
<script>const send = el => { document.getElementById('log').appendChild(document.createElement('li')).textContent = el.value; el.value = ''; };
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); send(document.getElementById('chat')); });</script></body></html>
