name: release

# Uploads to the package index by trusted publishing (OIDC): no token is stored anywhere.
# Runs only when a GitHub release is published, or when started by hand.
#   started by hand, target none      build and check only, upload nothing (the rehearsal)
#   started by hand, target testpypi  upload to test.pypi.org
#   started by hand, target pypi      upload to pypi.org
#   release published                 upload to pypi.org; the tag must be v<version in pyproject.toml>
# Before the first upload the index must know this workflow as a publisher: docs/release.md.
# Actions are pinned as in ci.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload (none: build and check only)"
        type: choice
        options: [none, testpypi, pypi]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: gate, checks, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0              # the history check reads every commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
      - name: the tag is the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          [ "$TAG" = "v$version" ] || { echo "tag $TAG, but pyproject.toml says $version (expected tag v$version)" >&2; exit 1; }
      - name: gate tests
        run: scripts/test.sh
      - name: versions agree, changelog entry, pinned actions; no private text in files or history
        run: |
          uv run --quiet --no-project --python 3.12 scripts/release_check.py meta
          uv run --quiet --no-project --python 3.12 scripts/release_check.py tree
          uv run --quiet --no-project --python 3.12 scripts/release_check.py history
      - name: the changelog entry carries a date
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG.md: the entry of $version has no release date" >&2; exit 1; }
      - name: the name on pypi.org is free or ours
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: uv run --quiet --no-project --python 3.12 scripts/release_check.py index
      - name: the name on test.pypi.org is free or ours
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        run: uv run --quiet --no-project --python 3.12 scripts/release_check.py index --index https://test.pypi.org
      - name: build both archives, check them, install each and drive the installed command
        run: scripts/e2e.sh --keep dist
      - name: what will be uploaded
        run: ls -l dist && sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  testpypi:
    name: upload to test.pypi.org
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write                 # the short-lived identity the index checks; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: upload to pypi.org
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write                 # the short-lived identity the index checks; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # v1.14.3
