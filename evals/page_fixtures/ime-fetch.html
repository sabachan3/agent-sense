<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search fetch</title></head><body><h1>Search</h1><input id="q" placeholder="Search">
<script>document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') fetch('clean.html?q=' + encodeURIComponent(e.target.value)); });</script></body></html>
