[project]
name = "agent-sense"
version = "0.1.0"
description = "Local, deterministic checks for work done with coding agents: is it really done, does the page really work, is it ready to publish"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sabachan3" }]
dependencies = []
keywords = ["coding-agent", "claude-code", "lint", "pre-commit", "hooks", "testing", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sabachan3/agent-sense"
Documentation = "https://github.com/sabachan3/agent-sense/tree/main/docs"
Changelog = "https://github.com/sabachan3/agent-sense/blob/main/CHANGELOG.md"
Issues = "https://github.com/sabachan3/agent-sense/issues"

[project.optional-dependencies]
browser = ["playwright>=1.49"]   # needed by `page` and `launch` only

[project.scripts]
agent-sense = "agent_sense.cli:main"

[build-system]
requires = ["hatchling>=1.27"]   # 1.27: license expression and license-files (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_sense"]

# The runtime services ship inside the package; tests, evals and docs stay in the repository.
[tool.hatch.build.targets.wheel.force-include]
"services/done/done_lib.py" = "agent_sense/_services/done/done_lib.py"
"services/deps/deps_lib.py" = "agent_sense/_services/deps/deps_lib.py"
"services/context/context_lib.py" = "agent_sense/_services/context/context_lib.py"
"services/boundary/boundary_lib.py" = "agent_sense/_services/boundary/boundary_lib.py"
"services/features/features_lib.py" = "agent_sense/_services/features/features_lib.py"
"services/page/page_lib.py" = "agent_sense/_services/page/page_lib.py"
"services/launch/launch_lib.py" = "agent_sense/_services/launch/launch_lib.py"
"services/session/session_lib.py" = "agent_sense/_services/session/session_lib.py"
"services/launch/vendors.json" = "agent_sense/_services/launch/vendors.json"
"contracts/schema.py" = "agent_sense/_services/contracts/schema.py"
"contracts/__init__.py" = "agent_sense/_services/contracts/__init__.py"

# The sdist holds what builds the wheel, plus the documents. Tests and evals need the repository
# (conftest.py, scripts/, fixtures) and stay there; scripts/release_check.py lists what may be inside.
[tool.hatch.build.targets.sdist]
include = ["agent_sense", "services", "contracts", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["services/*/tests"]
