<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clipped text</title><style>body{font-family:sans-serif;margin:16px;font-size:16px}
.badge{width:120px;white-space:nowrap;overflow:hidden}
.card{width:200px;height:22px;overflow:hidden;line-height:20px}
.fits{width:300px;overflow:hidden}
.trunc{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="badge">Enterprise plan with priority support</div>
<p class="card">This description runs over several lines and the box only shows the first one of them.</p>
<p class="fits">Short text.</p>
<p class="trunc">Truncated on purpose with an ellipsis</p>
</body></html>
