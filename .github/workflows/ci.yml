name: ci

# Every action is pinned to a full commit SHA with the version it stands for in a comment
# (tests/test_release.py refuses anything else). To update one:
#   gh api repos/OWNER/REPO/git/ref/tags/vX.Y.Z --jq '.object.type + " " + .object.sha'
# and, when the type is "tag", gh api repos/OWNER/REPO/git/tags/SHA --jq .object.sha for the commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
      - name: gate tests
        shell: bash
        env:
          AGENT_SENSE_PYTHON: ${{ matrix.python }}
        run: scripts/test.sh

  evals:
    name: known-answer evals ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
      - name: git identity for the throwaway repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: done, deps, context, boundary, features, session
        run: |
          for check in done deps context boundary features; do
            uv run --quiet --no-project --python 3.12 "evals/${check}_eval.py"
          done
          uv run --quiet --no-project --python 3.12 evals/session_eval.py --skip-field
          uv run --quiet --no-project --python 3.12 evals/session_pushback_eval.py --quiet

  browser-evals:
    name: page and launch evals in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
      - name: install Chromium
        run: uv run --quiet --no-project --python 3.12 --with playwright playwright install --with-deps chromium-headless-shell
      - name: page
        run: uv run --quiet --no-project --python 3.12 --with playwright evals/page_eval.py
      - name: launch
        run: uv run --quiet --no-project --python 3.12 --with playwright evals/launch_eval.py

  package:
    name: build, check and install the wheel and the sdist, run the installed command
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
      - name: versions agree, changelog entry, pinned actions; no private text in tracked files
        run: |
          uv run --quiet --no-project --python 3.12 scripts/release_check.py meta
          uv run --quiet --no-project --python 3.12 scripts/release_check.py tree
      - name: build both archives, check them, install each and drive the installed command
        run: scripts/e2e.sh --keep dist
      - name: install the wheel and check this repository with it
        run: |
          uv tool install --python 3.12 dist/*.whl
          agent-sense --version
          agent-sense deps
          agent-sense context
          agent-sense boundary
          agent-sense features --run --only features
          agent-sense done --run
          agent-sense all
