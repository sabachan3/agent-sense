<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat guarded</title></head><body><h1>Chat</h1><ul id="log"></ul><textarea id="chat" placeholder="Message"></textarea>
<script>const send = el => { document.getElementById('log').appendChild(document.createElement('li')).textContent = el.value; el.value = ''; };
document.getElementById('chat').addEventListener('keydown', e => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter') { e.preventDefault(); send(e.target); } });</script></body></html>
